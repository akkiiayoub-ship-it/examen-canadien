<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Examen blanc QCM Pédagogie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Sora:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: training hub. Home = library of series + quick drills; Quiz = sticky HUD + one card; Results = gauge, theme bars, review. Colour carries meaning: A/B/C/D, +1/−1/0, 12 theme hues. */
:root{
  --bg:#eef4f9;--surface:#ffffff;--soft:#f1f6fb;--ink:#0b2240;--mute:#55698a;--line:#d8e3ee;
  --brand:#004890;--brand2:#3ca8c0;--green:#00843c;--grey:#9c9c9c;
  --good:#00843c;--goodbg:#dcf3e5;--bad:#d63a4a;--badbg:#fde5e8;--zero:#b07a00;--zerobg:#fff2d0;
  --A:#00964a;--B:#1565c0;--C:#2fa3bd;--D:#e09b00;--E:#7e57c2;
  --display:"Sora","Bricolage Grotesque",Georgia,sans-serif;--body:"Manrope","Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --shadow:0 14px 34px -16px rgba(0,40,90,.35);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#03112a;--surface:#0b1f40;--soft:#10294f;--ink:#e9f2ff;--mute:#9cb2d2;--line:#1d3b66;--brand:#3d8bff;--brand2:#45c3dc;--green:#2fcf7a;--good:#3ddc84;--goodbg:#0c3a28;--bad:#ff6b7d;--badbg:#45162a;--zero:#f5c044;--zerobg:#3c300f;--A:#2fcf7a;--B:#4b9bff;--C:#45c3dc;--D:#f5b400;--E:#a98bff;--shadow:0 16px 36px -16px rgba(0,0,0,.7);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#03112a;--surface:#0b1f40;--soft:#10294f;--ink:#e9f2ff;--mute:#9cb2d2;--line:#1d3b66;--brand:#3d8bff;--brand2:#45c3dc;--green:#2fcf7a;--good:#3ddc84;--goodbg:#0c3a28;--bad:#ff6b7d;--badbg:#45162a;--zero:#f5c044;--zerobg:#3c300f;--A:#2fcf7a;--B:#4b9bff;--C:#45c3dc;--D:#f5b400;--E:#a98bff;--shadow:0 16px 36px -16px rgba(0,0,0,.7);color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;overflow-x:hidden}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.1}
button{font-family:inherit;color:inherit}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.wrap{max-width:960px;margin:0 auto;padding:16px}
.hidden{display:none!important}
.btn{border:0;border-radius:12px;padding:10px 16px;font-weight:700;font-size:15px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:transform .1s,box-shadow .15s,border-color .15s;background:none}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(135deg,var(--brand),#7b5cff);color:#fff;box-shadow:0 6px 16px -6px var(--brand)}
.btn.soft{background:var(--surface);border:1.5px solid var(--line)}
.btn.soft:hover{border-color:var(--brand)}
.btn.skip{background:var(--zerobg);color:var(--zero);border:1.5px solid transparent}
.btn.skip.on{border-color:var(--zero)}
.btn:disabled{opacity:.4;cursor:default}
.panel{background:var(--surface);border:1.5px solid var(--line);border-radius:20px;padding:18px;box-shadow:var(--shadow)}
kbd{font-family:var(--body);font-size:11px;font-weight:700;padding:1px 6px;border-radius:5px;border:1px solid var(--line);background:var(--soft);color:var(--mute)}
.tip{font-size:14px;color:var(--mute);margin:0}
.tip b{color:var(--ink)}
.sec{display:flex;align-items:baseline;gap:10px;margin:26px 0 12px;flex-wrap:wrap}
.sec h2{font-size:24px}
.sec span{font-size:14px;color:var(--mute)}

/* top bar */
.top{display:flex;align-items:center;gap:10px;padding:12px 16px;max-width:960px;margin:0 auto}
.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--brand),var(--brand2));display:grid;place-items:center;color:#fff;font-family:var(--display);font-weight:800}
.top b{font-family:var(--display);font-size:17px;flex:1}
.theme-t{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 10px;cursor:pointer;font-weight:700;font-size:13px}

/* hero */
.hero{position:relative;overflow:hidden;border-radius:24px;padding:26px;background:linear-gradient(135deg,#5b3df5 0%,#9b3df5 45%,#ff4f8b 100%);color:#fff;box-shadow:var(--shadow);display:grid;grid-template-columns:1fr auto;gap:20px;align-items:center}
.hero canvas{position:absolute;inset:0;width:100%;height:100%;opacity:.3;pointer-events:none}
.hero>*{position:relative}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
.hero h1{font-size:clamp(28px,4.6vw,42px);font-weight:800;margin:8px 0 10px}
.hero p{max-width:58ch;margin:0;opacity:.95}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(110px,1fr));gap:8px}
.kpi{background:rgba(255,255,255,.16);backdrop-filter:blur(6px);border-radius:14px;padding:10px 12px;min-width:110px}
.kpi b{display:block;font-family:var(--display);font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;font-weight:600;opacity:.9}
.resume{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:14px;border-left:5px solid var(--brand2)}
.resume .tip{flex:1;min-width:200px}

/* series library */
.lib{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.sc{position:relative;text-align:left;cursor:pointer;border:1.5px solid var(--line);background:var(--surface);border-radius:18px;padding:16px;transition:transform .15s,border-color .15s,box-shadow .15s;display:flex;flex-direction:column;gap:8px;min-height:168px}
.sc:hover{transform:translateY(-3px);border-color:var(--c);box-shadow:0 14px 26px -16px var(--c)}
.sc .bar{position:absolute;left:0;top:0;bottom:0;width:6px;border-radius:18px 0 0 18px;background:var(--c)}
.sc h3{font-size:20px}
.sc .sub{font-size:13px;color:var(--mute)}
.sc .best{margin-top:auto;display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:13px;color:var(--mute)}
.pill{white-space:nowrap;font-weight:800;font-size:13px;padding:3px 10px;border-radius:999px;font-variant-numeric:tabular-nums}
.pill.g{background:var(--goodbg);color:var(--good)}.pill.r{background:var(--badbg);color:var(--bad)}.pill.z{background:var(--soft);color:var(--mute)}
.spark{height:26px;width:100%}
.mbar{display:block;height:6px;border-radius:3px;background:var(--line);overflow:hidden}.mbar i{display:block;height:100%;border-radius:3px;transition:width .8s}
.mtx{font-size:12px;color:var(--mute);font-weight:600}
.sc.feat{grid-column:span 2;background:linear-gradient(135deg,color-mix(in srgb,var(--brand) 10%,var(--surface)),var(--surface))}
.guide{border-left:6px solid var(--E)}
.gtop{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.gtop>div:first-child{flex:1;min-width:240px}
.gact{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.drills{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.drill.big{background:linear-gradient(135deg,color-mix(in srgb,var(--brand) 14%,var(--surface)),color-mix(in srgb,var(--brand2) 10%,var(--surface)));border-color:color-mix(in srgb,var(--brand) 40%,var(--line))}
.field{margin:14px 0}.field>label{display:flex;gap:8px;align-items:baseline;font-weight:800;font-size:14px;margin-bottom:8px}
.avail{font-weight:600;color:var(--mute);font-size:13px}
.seg{display:flex;flex-wrap:wrap;gap:6px}.seg button,.nchip{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 12px;font-weight:700;font-size:14px;cursor:pointer}
.seg button.on,.nchip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.nrow{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.nrow input{width:84px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:7px 10px;font:inherit;font-weight:700}
.tchip.sm{padding:5px 10px 5px 6px;font-size:13px;opacity:.55}.tchip.sm.on{opacity:1;border-color:var(--c);background:color-mix(in srgb,var(--c) 12%,var(--surface))}
.lnk{border:0;background:none;color:var(--brand);font-weight:700;font-size:13px;cursor:pointer;padding:0}
.comp{max-height:62vh;overflow:auto;padding-right:4px}
.modal .panel.wide{width:min(680px,100%)}
.drill{cursor:pointer;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:18px;padding:16px;transition:transform .15s,border-color .15s}
.drill:hover{transform:translateY(-3px);border-color:var(--brand)}
.drill .ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:#fff;font-family:var(--display);font-weight:800;font-size:18px;margin-bottom:10px}
.drill h3{font-size:18px;margin-bottom:4px}
.drill:disabled{opacity:.5;cursor:default;transform:none}
.themes{display:flex;flex-wrap:wrap;gap:8px}
.tchip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px 7px 8px;font-weight:700;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:border-color .15s,transform .1s}
.tchip:hover{border-color:var(--c);transform:translateY(-1px)}
.tchip i{width:22px;height:22px;border-radius:7px;background:var(--c);color:#fff;font-style:normal;font-size:12px;display:grid;place-items:center}
.tchip small{color:var(--mute);font-weight:600}
.bareme{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
.chip{border-radius:14px;padding:10px;text-align:center}
.chip b{display:block;font-family:var(--display);font-size:26px;line-height:1}
.chip span{font-size:13px;font-weight:600}
.chip.g{background:var(--goodbg);color:var(--good)}.chip.r{background:var(--badbg);color:var(--bad)}.chip.z{background:var(--zerobg);color:var(--zero)}

/* mode picker modal */
.modal{position:fixed;inset:0;background:rgba(15,10,40,.5);z-index:40;display:grid;place-items:center;padding:16px;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.modal .panel{width:min(520px,100%);animation:pop .3s}
.modal h3{font-size:24px;margin-bottom:6px}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.mopt{cursor:pointer;text-align:left;border:2px solid var(--line);border-radius:16px;padding:14px;background:var(--surface)}
.mopt.on{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 8%,var(--surface))}
.mopt b{display:block;font-family:var(--display);font-size:18px}
.mopt span{font-size:13px;color:var(--mute)}
.opts{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:14px;font-size:14px}
.opts label{display:flex;gap:6px;align-items:center;cursor:pointer}
.opts input{accent-color:var(--brand);width:16px;height:16px}
.row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}

/* HUD */
.hud{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hudin{max-width:960px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ring{position:relative;width:52px;height:52px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .t{position:absolute;inset:0;display:grid;place-items:center;font-size:11px;font-weight:800;font-variant-numeric:tabular-nums}
.hudtitle{flex:1;min-width:130px}
.hudtitle b{font-family:var(--display);font-size:17px;display:block}
.hudtitle span{font-size:13px;color:var(--mute)}
.counters{display:flex;gap:6px}
.cnt{border-radius:10px;padding:4px 9px;font-weight:800;font-variant-numeric:tabular-nums;font-size:15px;min-width:50px;text-align:center}
.cnt small{display:block;font-size:10px;font-weight:700;opacity:.8;letter-spacing:.03em}
.cnt.g{background:var(--goodbg);color:var(--good)}.cnt.r{background:var(--badbg);color:var(--bad)}.cnt.z{background:var(--zerobg);color:var(--zero)}.cnt.s{background:var(--brand);color:#fff}
.bump{animation:bump .4s}
@keyframes bump{40%{transform:scale(1.25)}}
.segs{display:grid;gap:2px;max-width:960px;margin:0 auto;padding:0 16px 8px}
.segs i{height:6px;border-radius:3px;background:var(--line);cursor:pointer;transition:background .2s,transform .2s}
.segs i.a{background:var(--brand)}.segs i.k{background:var(--zero)}.segs i.cur{transform:scaleY(2)}.segs i.g{background:var(--good)}.segs i.r{background:var(--bad)}

/* question */
.stage{margin-top:14px}
.qcard{background:var(--surface);border:1.5px solid var(--line);border-radius:22px;padding:22px;box-shadow:var(--shadow)}
.in-r{animation:inR .3s cubic-bezier(.2,.8,.2,1)}.in-l{animation:inL .3s cubic-bezier(.2,.8,.2,1)}
@keyframes inR{from{opacity:0;transform:translateX(36px)}}@keyframes inL{from{opacity:0;transform:translateX(-36px)}}
.qhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.qnum{font-family:var(--display);font-weight:800;font-size:14px;background:var(--ink);color:var(--surface);border-radius:999px;padding:4px 12px}
.ttag{font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;color:#fff}
.srcg{font-size:12px;color:var(--mute);font-weight:600}
.flagb{margin-left:auto;background:none;border:1.5px solid var(--line);border-radius:999px;padding:4px 12px;font-weight:700;font-size:13px;color:var(--mute);cursor:pointer}
.flagb.on{background:var(--zerobg);border-color:var(--zero);color:var(--zero)}
.stem{font-size:clamp(17px,2.3vw,20px);font-weight:600;margin:0 0 16px;max-width:72ch}
.tiles{display:grid;gap:10px}
.tile{display:flex;align-items:center;gap:14px;text-align:left;width:100%;border:2px solid var(--line);background:var(--surface);border-radius:16px;padding:11px 14px;cursor:pointer;font-size:16px;transition:transform .12s,border-color .15s,background .15s,box-shadow .15s}
.tile:hover{transform:translateX(4px);border-color:var(--c)}
.tile .L{flex:none;width:36px;height:36px;border-radius:11px;background:var(--c);color:#fff;font-family:var(--display);font-weight:800;font-size:17px;display:grid;place-items:center;transition:transform .2s}
.tile.sel{border-color:var(--c);background:color-mix(in srgb,var(--c) 12%,var(--surface));box-shadow:0 6px 18px -10px var(--c)}
.tile.sel .L{transform:rotate(-8deg) scale(1.08)}
.tile.lock{cursor:default}.tile.lock:hover{transform:none}
.tile.good{border-color:var(--good);background:var(--goodbg);animation:pop .45s}.tile.good .L{background:var(--good)}
.tile.bad{border-color:var(--bad);background:var(--badbg);animation:shake .45s}.tile.bad .L{background:var(--bad)}
.tile.dim{opacity:.5}
.tile.out{opacity:.35;text-decoration:line-through}
@keyframes pop{40%{transform:scale(1.03)}}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.mark{margin-left:auto;font-weight:800;font-size:13px;flex:none}
.multi{font-size:12px;font-weight:800;padding:4px 10px;border-radius:999px;background:color-mix(in srgb,var(--E) 16%,var(--surface));color:var(--E);border:1.5px dashed var(--E)}
.tile.sq .L{border-radius:8px;box-shadow:inset 0 0 0 3px rgba(255,255,255,.35)}
.tile.sq.sel .L::after{content:'✓';position:absolute;transform:translate(14px,-14px);font-size:13px;background:var(--surface);color:var(--c);border-radius:50%;width:18px;height:18px;display:grid;place-items:center;box-shadow:0 0 0 2px var(--c)}
.tile.good.miss{border-style:dashed;background:transparent;animation:none}
.tile.good.miss .L{background:transparent;color:var(--good);box-shadow:inset 0 0 0 2.5px var(--good)}
.elim{flex:none;margin-left:auto;border:0;background:none;color:var(--mute);font-size:12px;font-weight:700;cursor:pointer;padding:4px 6px;border-radius:8px}
.elim:hover{background:var(--soft)}
.explain{margin-top:14px;border-radius:16px;padding:14px 16px;background:var(--soft);border-left:5px solid var(--brand);animation:inR .3s}
.explain .v{font-family:var(--display);font-weight:800;font-size:19px;margin-bottom:2px}
.explain .x{font-size:14px;color:var(--mute);margin-bottom:8px;font-style:italic}
.explain .src{display:block;margin-top:6px;font-size:13px;color:var(--mute)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;align-items:center}
.actions .sp{flex:1}
.keys{font-size:12px;color:var(--mute);margin-top:12px;display:flex;gap:10px;flex-wrap:wrap}
.streak{display:inline-flex;align-items:center;gap:4px;font-weight:800;font-size:13px;color:#fff;background:linear-gradient(135deg,#ff9f1c,#ff4f8b);padding:4px 10px;border-radius:999px}
.float{position:fixed;font-family:var(--display);font-weight:800;font-size:42px;pointer-events:none;z-index:50;animation:flt .9s forwards}
@keyframes flt{from{opacity:1;transform:translate(-50%,0) scale(.6)}30%{transform:translate(-50%,-26px) scale(1.15)}to{opacity:0;transform:translate(-50%,-100px)}}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:12px;font-weight:700;z-index:60;animation:toast 2.2s forwards;max-width:90vw;text-align:center}
@keyframes toast{0%{opacity:0;transform:translate(-50%,20px)}10%,85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}

/* drawer */
.drawer{position:fixed;inset:0;background:rgba(15,10,40,.45);z-index:30;display:flex;justify-content:flex-end}
.drawer .in{width:min(380px,92vw);height:100%;background:var(--surface);padding:20px;overflow:auto;animation:dr .22s}
@keyframes dr{from{transform:translateX(100%)}}
.dots{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:14px}
.dots button{aspect-ratio:1;border-radius:12px;border:2px solid var(--line);background:var(--surface);font-weight:800;cursor:pointer;position:relative}
.dots button.a{background:var(--brand);border-color:var(--brand);color:#fff}
.dots button.k{background:var(--zerobg);border-color:var(--zero);color:var(--zero)}
.dots button.f::after{content:"";position:absolute;top:-4px;right:-4px;width:10px;height:10px;border-radius:50%;background:var(--brand2);border:2px solid var(--surface)}
.dots button.cur{outline:3px solid var(--brand2);outline-offset:1px}
.dots button.g{background:var(--good);border-color:var(--good);color:#fff}
.dots button.r{background:var(--bad);border-color:var(--bad);color:#fff}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--mute);margin-top:12px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-1px;margin-right:4px}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}

/* results */
.res-hero{display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:center}
.gauge{position:relative;width:180px;height:180px}
.gauge .n{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.gauge .n b{display:block;font-family:var(--display);font-size:52px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.gauge .n span{font-size:13px;color:var(--mute);font-weight:600}
.res-hero h2{font-size:clamp(24px,4vw,34px);margin-bottom:4px}
.quote{font-size:15px;font-style:italic;color:var(--mute);margin-bottom:6px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}
.stat{border-radius:14px;padding:10px 12px;background:var(--soft)}
.stat b{display:block;font-family:var(--display);font-size:24px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--mute);font-weight:600}
.insight{display:grid;gap:8px;margin-top:14px}
.insight div{border-radius:12px;padding:10px 14px;background:var(--soft);font-size:15px}
.th-row{display:grid;grid-template-columns:28px 1fr 190px 46px;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.th-row:last-child{border-bottom:0}
.th-row .dot{width:28px;height:28px;border-radius:9px;color:#fff;font-weight:800;font-size:13px;display:grid;place-items:center}
.th-row .nm{font-size:14px;font-weight:600}
.th-row .nm small{display:block;color:var(--mute);font-weight:500}
.div{position:relative;height:16px;background:var(--soft);border-radius:8px}
.div::after{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:2px;background:var(--mute);opacity:.4}
.div i{position:absolute;top:0;bottom:0;border-radius:8px;transition:width 1s cubic-bezier(.2,.8,.2,1)}

.filters{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.filters button{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:700;font-size:14px;cursor:pointer}

.rev .o.g{background:var(--goodbg);font-weight:600}

.loading{display:grid;place-items:center;height:60vh;font-weight:700;color:var(--mute)}

  .hero{grid-template-columns:1fr}.sc.feat{grid-column:auto}.drills{grid-template-columns:1fr}

}

/* ===== SKIN OFPPT · CMC — palette tirée des logos : bleu #004890, vert #00843c, gris #9c9c9c, turquoise CMC #3ca8c0 ===== */

#bgfx{position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.55}

.btn.primary{background:linear-gradient(120deg,var(--green),var(--brand2) 50%,var(--brand));background-size:200% 100%;transition:background-position .5s,transform .1s,box-shadow .2s;box-shadow:0 8px 22px -10px var(--brand2)}

.hero::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(100deg,rgba(2,14,40,.94) 0%,rgba(0,72,144,.78) 45%,rgba(0,132,60,.35) 100%)}
.hero canvas{opacity:.3;z-index:-1}
.hero h1{font-size:clamp(30px,5vw,50px)}
.hero h1 .grad{background:linear-gradient(90deg,#7ee2a8,#7fd6ea,#9cc4ff,#7ee2a8);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:gshift 8s linear infinite}
@keyframes gshift{to{background-position:300% 0}}
.hero .eyebrow{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);padding:5px 12px;border-radius:999px;backdrop-filter:blur(6px)}
.hero .eyebrow i{width:8px;height:8px;border-radius:50%;background:#3ddc84;box-shadow:0 0 0 0 #3ddc84;animation:ping 2s infinite}
@keyframes ping{70%{box-shadow:0 0 0 10px rgba(61,220,132,0)}100%{box-shadow:0 0 0 0 rgba(61,220,132,0)}}
.kpi{border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.1)}
.hero .cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.btn.glass{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);color:#fff;backdrop-filter:blur(6px)}
.btn.glass:hover{background:rgba(255,255,255,.2)}
.dotsnav{display:flex;gap:6px;margin-top:16px}

.dotsnav i.on{background:#fff;width:40px}
/* marquee */
.marq{overflow:hidden;margin:16px 0 4px;mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.marq .tr{display:flex;gap:10px;width:max-content;animation:marq 40s linear infinite}
.marq:hover .tr{animation-play-state:paused}
@keyframes marq{to{transform:translateX(-50%)}}
.marq span{white-space:nowrap;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-weight:700;font-size:14px;display:inline-flex;gap:8px;align-items:center}
.marq span i{width:9px;height:9px;border-radius:3px;transform:rotate(45deg);background:var(--c)}
/* glass + spotlight cards */
.panel,.sc,.drill,.qcard{background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(10px)}
.sc,.drill,.panel.guide{position:relative;overflow:hidden}

.sc{transform:perspective(800px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .15s,border-color .2s,box-shadow .2s}

.sc.feat{background:linear-gradient(135deg,color-mix(in srgb,var(--brand) 22%,var(--surface)),color-mix(in srgb,var(--green) 14%,var(--surface)))}
.sec h2{background:linear-gradient(90deg,var(--ink),var(--brand2));-webkit-background-clip:text;background-clip:text;color:transparent}
.sec::before{content:"";width:12px;height:12px;border-radius:3px;transform:rotate(45deg);background:linear-gradient(135deg,var(--green),var(--brand2),var(--brand));align-self:center;flex:none}
/* reveal: visible at rest, animated when it enters */
.rv.rv-in{animation:rvin .7s cubic-bezier(.2,.8,.2,1) both}
@keyframes rvin{from{opacity:.0;transform:translateY(24px) scale(.98)}}
/* gallery */
.gal{display:grid;grid-template-columns:2fr 1fr 1fr;grid-auto-rows:150px;gap:10px}

.gal figcaption{position:absolute;left:8px;bottom:8px;right:8px;font-size:12px;font-weight:700;color:#fff;background:rgba(3,16,41,.6);backdrop-filter:blur(6px);padding:5px 10px;border-radius:10px;width:fit-content}
.disc{font-size:12px;color:var(--mute);text-align:center;margin:10px auto 0;max-width:70ch}
/* progress halo on HUD */

.qcard{border-image:none}
.tile .L{box-shadow:0 6px 14px -8px var(--c)}
/* scroll progress */
#sprog{position:fixed;left:0;top:0;height:3px;width:0;z-index:80;background:linear-gradient(90deg,var(--green),var(--brand2),var(--brand))}

<body>
<canvas id="bgfx" aria-hidden="true"></canvas><div id="sprog"></div><canvas id="confetti"></canvas>
<div class="top" id="topbar"><div class="brandlogos"><img src="img/ec/logo-ofppt.png" alt="OFPPT" width="52" height="34"><img src="img/ec/logo-cmc.png" alt="Cités des Métiers et des Compétences" width="44" height="34"><div style="min-width:0"><b>Examen canadien · Pédagogie</b><small>Concours de promotion interne · catégorie 19-20</small></div></div><button class="theme-t" id="themeT" title="Changer de thème">◐ Thème</button></div>

<main id="home" class="wrap"><div class="loading">Chargement des 480 questions…</div></main>
<section id="quiz" class="hidden">
  <div class="hud"><div class="hudin">
    <div class="ring"><svg width="52" height="52"><circle cx="26" cy="26" r="22" fill="none" stroke="var(--line)" stroke-width="6"/><circle id="ringArc" cx="26" cy="26" r="22" fill="none" stroke="var(--brand)" stroke-width="6" stroke-linecap="round" stroke-dasharray="138.2" stroke-dashoffset="0"/></svg><div class="t" id="ringT">0:00</div></div>
    <div class="hudtitle"><b id="hudName"></b><span id="hudSub"></span></div>
    <div class="counters" id="counters"></div>
    <button class="btn soft" id="openMap" title="Vue d'ensemble (G)">Grille</button>
    <button class="btn soft" id="quitBtn" title="Retour à l'accueil, copie sauvegardée">Accueil</button>
    <button class="btn primary" id="finishBtn">Remettre</button>
  </div><div class="segs" id="segs"></div></div>
  <div class="wrap"><div class="stage" id="stage"></div></div>
</section>
<section id="results" class="wrap hidden"></section>

<div id="drawer" class="drawer hidden"><div class="in">
  <div style="display:flex;align-items:center;justify-content:space-between"><h3 style="font-size:22px">Vue d'ensemble</h3><button class="btn soft" id="closeMap">Fermer</button></div>
  <div class="dots" id="dots"></div><div class="legend" id="mapLegend"></div>
</div></div>
<div id="modal" class="modal hidden"><div class="panel" id="modalIn"></div></div>

<script>
const THC=['#004890','#00843c','#3ca8c0','#1f6fd1','#2e9e5b','#0e7d96','#5b6ee1','#e09b00','#c2508a','#7a8794','#d4692a','#7e57c2'];
const SHORT=['Métacognition','Andragogie','APC','Charge cognitive','Questionnement','Transfert','Différenciation','Ludopédagogie','Inclusion','Posture réflexive','Scénarisation','Éthique'];
const TH=['Ingénierie de la métacognition appliquée au geste professionnel','Andragogie et posture du formateur face à un public d’adultes','Alignement pédagogique orienté compétences (APC)','Gestion de la charge cognitive en contexte technique et gestuel','Techniques de questionnement pour l’analyse de pratique professionnelle','Transfert des apprentissages vers le poste de travail','Différenciation pédagogique face à l’hétérogénéité des parcours','Ludopédagogie appliquée aux compétences comportementales et techniques','Inclusion et accessibilité en centre de formation professionnelle','Posture réflexive du formateur sur sa pratique en atelier/centre','Scénarisation pédagogique articulant théorie et pratique','Neutralité et posture éthique du formateur face aux réalités du monde du travail'];
const SER_C=['#004890','#00843c','#3ca8c0','#1f6fd1','#2e9e5b','#0e7d96','#5b6ee1','#e09b00','#7e57c2'];
const L='ABCDE',COL=['var(--A)','var(--B)','var(--C)','var(--D)','var(--E)'];
const PH={
  good:['Bien vu !','Exact, c’est la bonne nuance.','Parfait, réponse de formateur aguerri.','Juste ! Vous avez lu jusqu’au bout.','Très bien, +1 mérité.','C’est ça : le mot qui change tout ne vous a pas échappé.','Excellent réflexe pédagogique.','Bonne réponse, on continue sur cette lancée.'],
  bad:['Presque : relisez le mot qui fait la différence.','Piège classique, notez-le pour le jour J.','Pas cette fois : la justification vous donne la clé.','Raté, mais c’est ici qu’on apprend.','Attention : proposition proche, mais pas exacte.','Erreur utile : elle ne se reproduira pas.','Le barème canadien punit ce genre d’hésitation : doutez, passez.'],
  near:['Si près du but : une seule proposition mal jugée.','Presque parfait, mais en QCM multiple c’est tout ou rien.','Une case de trop ou de moins : relisez chaque proposition isolément.'],
  skip:['Sage abstention : 0 point vaut mieux que −1.','Passée sans risque. Voici quand même la réponse.','Prudent. Retenez la justification pour la prochaine fois.','Bonne gestion du risque si vous doutiez vraiment.'],
  streak:{3:'Série de 3 ! Vous êtes lancé.',5:'5 d’affilée : excellent rythme.',8:'8 de suite, impressionnant.',12:'12 d’affilée ! Niveau concours atteint.'}
};
const KEY='qcm1920.v3', reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const $=id=>document.getElementById(id);
const esc=t=>String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const fmt=s=>{s=Math.max(0,Math.round(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+':'+String(m).padStart(2,'0'):m)+':'+String(x).padStart(2,'0')};
const sgn=n=>(n>0?'+':n<0?'−':'')+Math.abs(n);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

let D=null, ST={hist:{},err:{},seen:{},ok:{},cur:null,theme:null,pref:{}}, S=null, tick=null, dir='r';
function persist(){try{localStorage.setItem(KEY,JSON.stringify(ST))}catch(e){}}
function restore(){try{const x=JSON.parse(localStorage.getItem(KEY));if(x)ST=Object.assign(ST,x)}catch(e){}
  try{const c=ST.cur;if(c&&c.ans)c.ans=c.ans.map(a=>a===null||Array.isArray(a)?a:[a])}catch(e){}}
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2300)}

/* ---------- THEME TOGGLE ---------- */
$('themeT').onclick=()=>{const r=document.documentElement;const dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;r.dataset.theme=dark?'light':'dark';ST.theme=r.dataset.theme;persist()};

/* ---------- HOME ---------- */
const okN=ids=>ids.filter(i=>ST.ok&&ST.ok[i]).length;
function stats(){const h=Object.values(ST.hist).flat();const seen=Object.keys(ST.seen).length;const err=Object.keys(ST.err).length;const ok=Object.keys(ST.ok||{}).length;
  const best=h.length?Math.max(...h.filter(x=>x.n===60).map(x=>x.net),-60):null;return {att:h.length,seen,err,ok,best:h.filter(x=>x.n===60).length?best:null}}
function spark(arr,c){if(arr.length<2)return '';const w=180,h=26,mn=-10,mx=60;const pts=arr.slice(-8).map((v,i,a)=>[i*(w/(a.length-1)),h-((Math.max(mn,v)-mn)/(mx-mn))*h]);
  return '<svg class="spark" viewBox="0 -3 '+w+' '+(h+6)+'" preserveAspectRatio="none"><polyline fill="none" stroke="'+c+'" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" points="'+pts.map(p=>p.join(',')).join(' ')+'"/><circle cx="'+pts[pts.length-1][0]+'" cy="'+pts[pts.length-1][1]+'" r="3.5" fill="'+c+'"/></svg>'}
function renderHome(){
  const k=stats();
  let h='<div class="hero rv"><div class="slides" id="slides">'+HERO.map((s,k)=>'<img src="img/ec/'+s[0]+'" alt="'+s[1]+'"'+(k?' loading="lazy"':' class="on"')+'>').join('')+'</div><canvas id="heroCv"></canvas><div><div class="eyebrow"><i></i>Concours de promotion interne · Pédagogie · Catégorie 19-20</div><h1>Entraînement au QCM,<br><span class="grad">notation canadienne</span></h1><p>L’examen blanc, les 8 séries d’entraînement et les 120 QCM du Guide visuel, soit '+D.q.length+' questions sur les 12 thèmes. Réponse juste +1, réponse fausse −1, question passée 0.</p><div class="cta"><button class="btn primary" id="ctaBlanc">Lancer l’examen blanc</button><button class="btn glass" id="ctaComp">⚙ Examen sur mesure</button></div><div class="dotsnav" id="dotsnav">'+HERO.map((s,k)=>'<i class="'+(k?'':'on')+'"></i>').join('')+'</div></div>';
  h+='<div class="kpis"><div class="kpi"><b>'+k.att+'</b><span>Épreuves faites</span></div><div class="kpi"><b>'+(k.best===null?'—':sgn(k.best))+'</b><span>Meilleur score /60</span></div><div class="kpi"><b>'+k.ok+'<small style="font-size:14px;opacity:.8"> /'+D.q.length+'</small></b><span>Maîtrisées · '+k.seen+' vues</span></div><div class="kpi"><b>'+k.err+'</b><span>Erreurs à revoir</span></div></div></div>';
  if(ST.cur&&!ST.cur.done){const c=ST.cur;h+='<div class="panel resume"><div class="tip"><b>Copie en cours : '+esc(c.name)+'</b> · '+(c.mode==='exam'?'mode examen':'mode entraînement')+' · question '+(c.cur+1)+' sur '+c.ids.length+' · '+c.ans.filter(a=>a!==null).length+' réponse(s)</div><button class="btn primary" id="resumeB">Reprendre</button><button class="btn soft" id="dropB">Abandonner</button></div>'}
  const mq=SHORT.map((t,k)=>'<span style="--c:'+THC[k]+'"><i></i>'+t+'</span>').join('');h+='<div class="marq" aria-hidden="true"><div class="tr">'+mq+mq+'</div></div>';
  h+='<div class="sec"><h2>Épreuves complètes</h2><span>60 questions · 2 heures · 5 questions par thème</span></div><div class="lib">';
  D.series.forEach((s,i)=>{if(s.guide)return;const hs=(ST.hist[s.id]||[]);const best=hs.length?Math.max(...hs.map(x=>x.net)):null;const last=hs.length?hs[hs.length-1].net:null;
    h+='<button class="sc'+(i===0?' feat':'')+'" style="--c:'+SER_C[i]+'" data-s="'+i+'"><span class="bar"></span><h3>'+s.name+'</h3><span class="sub">'+s.sub+'</span>'+spark(hs.map(x=>x.net),SER_C[i])+
      '<span class="mbar"><i style="width:'+(okN(s.qs)/s.qs.length*100)+'%;background:'+SER_C[i]+'"></i></span><span class="mtx">'+okN(s.qs)+'/'+s.qs.length+' maîtrisées</span><span class="best">'+(best===null?'<span class="pill z">Jamais faite</span>':'<span class="pill '+(best>=0?'g':'r')+'">Meilleur '+sgn(best)+'</span> dernier '+sgn(last)+' · '+hs.length+' essai(s)')+'</span></button>'});
  h+='</div>';
  const gi=D.series.findIndex(s=>s.guide),gs=D.series[gi],gh=ST.hist[gs.id]||[],gb=gh.length?Math.max(...gh.map(x=>x.net)):null;
  h+='<div class="sec"><h2>QCM du Guide visuel</h2><span>120 questions · 5 propositions · une ou plusieurs bonnes réponses</span></div><div class="panel guide"><div class="gtop"><div><h3 style="font-size:20px">Les 120 QCM argumentés du guide</h3><p class="tip">Cochez toutes les propositions justes. Barème canadien tout ou rien : +1 si la sélection est exactement la bonne, −1 sinon, 0 si vous passez. Corrigé argumenté du guide après chaque question.</p></div><div class="gact">'+(gb===null?'':'<span class="pill '+(gb>=0?'g':'r')+'">Meilleur '+sgn(gb)+' /120</span>')+'<span class="pill z">'+okN(gs.qs)+'/120 maîtrisées</span><button class="btn primary" data-s="'+gi+'">Les 120 QCM</button></div></div><div class="themes" style="margin-top:12px">';
  D.chapters.forEach((c,k)=>{h+='<button class="tchip" style="--c:'+THC[c.t]+'" data-ch="'+k+'"><i>'+c.n+'</i>'+c.name+' <small>'+okN(c.qs)+'/10</small></button>'});
  h+='</div></div>';
  h+='<div class="sec"><h2>Entraînements ciblés</h2><span>tirages aléatoires dans les '+D.q.length+' questions</span></div><div class="drills">';
  h+='<button class="drill big" id="dComp"><div class="ico" style="background:linear-gradient(135deg,#5b3df5,#ff4f8b)">⚙</div><h3>Examen sur mesure</h3><p class="tip">Sources, thèmes, type de QCM, nombre de questions, chrono, mode : composez votre épreuve.</p></button>';
  h+='<button class="drill" id="dFlash"><div class="ico" style="background:linear-gradient(135deg,#ff9f1c,#ff4f8b)">10</div><h3>Flash 10</h3><p class="tip">10 questions au hasard parmi celles pas encore maîtrisées. Idéal pour 5 minutes.</p></button>';
  h+='<button class="drill" id="dErr" '+(k.err?'':'disabled')+'><div class="ico" style="background:linear-gradient(135deg,#e5384f,#9b3df5)">↺</div><h3>Mes erreurs ('+k.err+')</h3><p class="tip">'+(k.err?'Rejouez les questions ratées. Une bonne réponse les retire de la liste.':'Vos questions ratées apparaîtront ici.')+'</p></button>';
  h+='<button class="drill" id="dNew"><div class="ico" style="background:linear-gradient(135deg,#12b5a5,#3d7bff)">✦</div><h3>Jamais vues</h3><p class="tip">20 questions que vous n’avez encore jamais rencontrées ('+(D.q.length-k.seen)+' restantes).</p></button></div>';

    h+='<div class="field"><label>Thèmes <button class="lnk" id="thAll">tous</button> · <button class="lnk" id="thNone">aucun</button></label><div class="themes">'+SHORT.map((t,k)=>'<button class="tchip sm'+(P.th.includes(k)?' on':'')+'" style="--c:'+THC[k]+'" data-th="'+k+'"><i>'+(k+1)+'</i>'+t+'</button>').join('')+'</div></div>';

/* ---------- SESSION ---------- */
function launch(src,mode,o){
  let ids=src.ids.slice();if(o.sq)ids=shuffle(ids);
  const n=ids.length;
  S={kind:src.kind,id:src.id,name:src.name,mode,ids,perm:ids.map(qi=>{const b=[...Array(D.q[qi].o.length).keys()];return o.so?shuffle(b):b}),ans:Array(n).fill(null),val:Array(n).fill(false),flag:Array(n).fill(false),elim:ids.map(()=>[]),cur:0,start:Date.now(),dur:o.dur!==undefined?o.dur:(src.timed&&mode==='exam'?7200:(mode==='exam'?n*120:0)),done:false,used:0,streak:0,best:0,filter:'all'};
  ST.cur=S;persist();openQuiz()}
const Qof=i=>D.q[S.ids[i]];
const isM=i=>!!Qof(i).c;
const corr=i=>(Qof(i).c||[Qof(i).a]).map(x=>S.perm[i].indexOf(x)).sort((a,b)=>a-b);  // displayed indices of correct answers
const has=(i,j)=>!!S.ans[i]&&S.ans[i].includes(j);
function pts(i){const a=S.ans[i];if(a===null)return 0;const c=corr(i);return a.length===c.length&&a.every((x,k)=>x===c[k])?1:-1}
function tally(){let g=0,r=0,z=0;for(let i=0;i<S.ids.length;i++){if(S.mode==='train'&&!S.val[i])continue;if(S.ans[i]===null)z++;else if(pts(i)>0)g++;else r++}return {g,r,z,net:g-r}}
function openQuiz(){$('home').classList.add('hidden');$('results').classList.add('hidden');$('quiz').classList.remove('hidden');
  $('segs').style.gridTemplateColumns='repeat('+S.ids.length+',1fr)';$('finishBtn').textContent=S.mode==='exam'?'Remettre':'Terminer';
  renderHud();renderQ();timer();scrollTo(0,0)}

function renderHud(){
  const n=S.ids.length,answered=S.ans.filter(a=>a!==null).length;
  $('hudName').textContent=S.name;
  if(S.mode==='exam'){$('hudSub').textContent='Examen · '+answered+'/'+n+' répondues';
    $('counters').innerHTML='<div class="cnt s" id="cA"><small>RÉPONDUES</small>'+answered+'</div><div class="cnt z"><small>MARQUÉES</small>'+S.flag.filter(Boolean).length+'</div>'}
  else{const t=tally();$('hudSub').textContent='Entraînement · '+S.val.filter(Boolean).length+'/'+n+' validées';
    $('counters').innerHTML='<div class="cnt g" id="cG"><small>JUSTES</small>+'+t.g+'</div><div class="cnt r" id="cR"><small>FAUSSES</small>−'+t.r+'</div><div class="cnt z" id="cZ"><small>PASSÉES</small>'+t.z+'</div><div class="cnt s" id="cS"><small>SCORE</small>'+sgn(t.net)+'</div>'}
  let s='';for(let i=0;i<n;i++){let c='';if(S.mode==='train'&&S.val[i])c=S.ans[i]===null?'k':(pts(i)>0?'g':'r');else if(S.ans[i]!==null)c='a';if(i===S.cur)c+=' cur';s+='<i class="'+c+'" data-g="'+i+'" title="Question '+(i+1)+'"></i>'}
  $('segs').innerHTML=s}
$('segs').onclick=e=>{const g=e.target.dataset.g;if(g!==undefined)go(+g)};
function timer(){clearInterval(tick);const f=()=>{const el=(Date.now()-S.start)/1000;
  if(S.dur){const r=S.dur-el;$('ringT').textContent=r>=3600?fmt(r).slice(0,-3):fmt(r);$('ringArc').style.strokeDashoffset=138.2*(1-Math.max(0,r/S.dur));
    $('ringArc').style.stroke=r<600?'var(--bad)':r<1800?'var(--zero)':'var(--brand)';if(r<=0){clearInterval(tick);toast('Temps écoulé : copie remise automatiquement.');finish()}}

function renderQ(){

    const ok=ci.includes(j),me=has(i,j);

    let mk='';if(locked&&ok)mk='<span class="mark" style="color:var(--good)">'+(mu?(me?'Cochée, juste':'À cocher aussi'):'Bonne réponse')+'</span>';else if(locked&&me)mk='<span class="mark" style="color:var(--bad)">'+(mu?'Cochée à tort':'Votre choix')+'</span>';

  h+='</div>';
  if(locked){const p=pts(i),sk=S.ans[i]===null;const v=sk?['0 point','var(--zero)']:p>0?['+1 point','var(--good)']:['−1 point','var(--bad)'];
    const part=mu&&!sk&&p<0?'<div class="x">'+judged(i)+' proposition(s) sur '+q.o.length+' bien jugée(s). Il fallait cocher exactement : '+ci.map(x=>L[x]).join(', ')+'.</div>':'';
    h+='<div class="explain" style="border-color:'+v[1]+'"><div class="v" style="color:'+v[1]+'">'+(S.fb&&S.fb[i]||'')+' <span style="font-size:15px">('+v[0]+')</span></div>'+part+'<b>'+(ci.length>1?'Réponses ':'Réponse ')+ci.map(x=>L[x]).join(', ')+'.</b> '+esc(q.j)+'<span class="src">Source : '+q.r+' · Thème '+(q.t+1)+' — '+esc(TH[q.t])+'</span></div>'}
  h+='<div class="actions"><button class="btn soft" id="prev" '+(i===0?'disabled':'')+'>← Précédente</button>';
  if(S.mode==='exam')h+='<button class="btn skip'+(S.ans[i]===null?' on':'')+'" id="clr">'+(S.ans[i]===null?'Passée · 0 pt':'Effacer ma réponse')+'</button>';

const GAL=[['campus-aerien-1.jpg','Campus vu du ciel'],['cmc-nador.jpg','Parvis d’une CMC'],['innovation.jpg','Espace innovation'],['siege-ofppt.jpg','Siège de l’OFPPT'],['campus-aerien-2.jpg','Campus et terrains de sport'],['cmc-dome.jpg','Une Cité des Métiers et des Compétences'],['tableau-vert.jpg','Apprendre, réviser'],['globe-craies.jpg','Réussir le concours']];
let slideT=null;
function heroSlides(){clearInterval(slideT);const im=[...document.querySelectorAll('#slides img')],dn=[...document.querySelectorAll('#dotsnav i')];if(reduce||im.length<2)return;let k=0;
  slideT=setInterval(()=>{if(!document.body.contains(im[0])){clearInterval(slideT);return}im[k].classList.remove('on');dn[k].classList.remove('on');k=(k+1)%im.length;im[k].classList.add('on');dn[k].classList.add('on')},5200)}
function fxBind(){
  document.querySelectorAll('#home .sc,#home .drill,#home .panel.guide').forEach(c=>{
    c.addEventListener('pointermove',e=>{const r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;c.style.setProperty('--mx',x*100+'%');c.style.setProperty('--my',y*100+'%');
      if(!reduce&&c.classList.contains('sc')){c.style.setProperty('--ry',(x-.5)*8+'deg');c.style.setProperty('--rx',(.5-y)*8+'deg')}});
    c.addEventListener('pointerleave',()=>{c.style.setProperty('--rx','0deg');c.style.setProperty('--ry','0deg')})});
  if(reduce||!('IntersectionObserver' in window))return;
  document.querySelectorAll('#home .sec,#home .lib .sc,#home .drill,#home .panel,#home .gal figure').forEach((el,k)=>el.classList.add('rv'));
  const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting&&e.boundingClientRect.top>innerHeight*.15){e.target.classList.add('rv-in');io.unobserve(e.target)}else if(e.isIntersecting)io.unobserve(e.target)}),{threshold:.12});
  document.querySelectorAll('#home .rv').forEach(el=>io.observe(el))}
addEventListener('scroll',()=>{const m=document.documentElement.scrollHeight-innerHeight;$('sprog').style.width=(m>0?scrollY/m*100:0)+'%'},{passive:true});
(function bg(){const c=$('bgfx'),x=c.getContext('2d');let W,H,P=[];const fit=()=>{W=c.width=innerWidth;H=c.height=innerHeight;const N=Math.min(46,Math.round(W*H/32000));P=Array.from({length:N},(_,k)=>({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.25,vy:(Math.random()-.5)*.25,s:5+Math.random()*9,c:k%3}))};fit();addEventListener('resize',fit);
  let mx=-999,my=-999;addEventListener('pointermove',e=>{mx=e.clientX;my=e.clientY});
  const col=()=>{const cs=getComputedStyle(document.documentElement);return [cs.getPropertyValue('--green').trim(),cs.getPropertyValue('--grey').trim()||'#9c9c9c',cs.getPropertyValue('--brand').trim()]};
  const draw=()=>{const C=col();x.clearRect(0,0,W,H);
    for(let i=0;i<P.length;i++){const p=P[i];if(!reduce){p.x+=p.vx;p.y+=p.vy;if(p.x<-20)p.x=W+20;if(p.x>W+20)p.x=-20;if(p.y<-20)p.y=H+20;if(p.y>H+20)p.y=-20;const dx=p.x-mx,dy=p.y-my,d=Math.hypot(dx,dy);if(d<140&&d>0){p.x+=dx/d*.9;p.y+=dy/d*.9}}
      x.save();x.translate(p.x,p.y);x.rotate(Math.PI/4);x.strokeStyle=C[p.c];x.globalAlpha=.55;x.lineWidth=2;x.strokeRect(-p.s/2,-p.s/2,p.s,p.s);x.restore();
      for(let j=i+1;j<P.length;j++){const q=P[j],dd=(p.x-q.x)**2+(p.y-q.y)**2;if(dd<22000){x.globalAlpha=.18*(1-dd/22000);x.strokeStyle=C[2];x.lineWidth=1;x.beginPath();x.moveTo(p.x,p.y);x.lineTo(q.x,q.y);x.stroke()}}}
    x.globalAlpha=1;if(!reduce)requestAnimationFrame(draw)};draw()})();

/* ---------- KEYS ---------- */
let xArm=false;
addEventListener('keydown',e=>{if($('quiz').classList.contains('hidden')||!$('modal').classList.contains('hidden'))return;if(e.ctrlKey||e.metaKey||e.altKey)return;
  const k=e.key.toLowerCase(),m={a:0,b:1,c:2,d:3,e:4,'1':0,'2':1,'3':2,'4':3,'5':4};
  if(k==='x'&&S.mode==='train'){xArm=true;return}
  if(k in m){if(xArm&&S.mode==='train'&&!S.val[S.cur])toggleElim(m[k]);else choose(m[k]);xArm=false;e.preventDefault();return}
  xArm=false;
  if(k==='arrowright')go(S.cur+1);else if(k==='arrowleft')go(S.cur-1);
  else if(k==='enter'&&S.mode==='train'){e.preventDefault();if(!S.val[S.cur]){if(S.ans[S.cur]!==null)validate(false)}else if(S.cur<S.ids.length-1)go(S.cur+1);else ask()}
  else if(k==='s'){if(S.mode==='exam'){S.ans[S.cur]=null;sv();renderQ();renderHud()}else validate(true)}
  else if(k==='m')toggleFlag();else if(k==='g')$('drawer').classList.contains('hidden')?openMap():closeMap();else if(k==='escape')closeMap()});
$('modal').onclick=e=>{if(e.target===$('modal'))closeModal()};

/* ---------- BOOT ---------- */
restore();document.documentElement.dataset.theme=ST.theme||'dark';
fetch('data.json').then(r=>{if(!r.ok)throw new Error(r.status);return r.json()}).then(d=>{D=d;renderHome()})
  .catch(()=>{$('home').innerHTML='<div class="loading">Impossible de charger les questions. Rechargez la page.</div>'});
</script>
</body>
